# Render blueprint for the API only. The frontend deploys separately to Vercel.
# The server refuses to boot in production unless ADMIN_PASSWORD / WATCHMAN_PASSWORD
# are set to non-demo values, and JWT_SECRET / COOKIE_SECRET are not the built-in ones.
services:
  - type: web
    name: sheetaldhara-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WATCHMAN_PHONE
        sync: false
      - key: WATCHMAN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
